<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seno start up | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              champagne: '#f6d88a',
              onyx: '#050505',
              graphite: '#111111'
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-onyx text-stone-100">
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="mb-8 flex flex-col gap-4 border-b border-white/10 pb-6 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.28em] text-champagne">seno start up</p>
          <h1 class="mt-2 text-3xl font-semibold text-white">Booking Verification Dashboard</h1>
          <p class="mt-3 max-w-2xl text-stone-400">View booking details, download passport or ID card images, and update verification status.</p>
        </div>
        <button id="refresh" class="rounded-full bg-champagne px-5 py-3 text-sm font-bold text-black transition hover:bg-[#ffe7a4]">Refresh</button>
      </header>

      <section id="status" class="mb-5 rounded-xl border border-white/10 bg-white/[0.04] px-4 py-3 text-sm text-stone-300">Loading bookings...</section>
      <section id="bookings" class="grid gap-4"></section>
    </main>

    <script>
      const bookingsEl = document.getElementById('bookings');
      const statusEl = document.getElementById('status');
      const statusOptions = ['Pending Verification', 'Verified', 'Rejected'];

      async function updateStatus(id, status) {
        const response = await fetch(`/api/bookings/${id}/status`, {
          method: 'PATCH',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (!response.ok) {
          alert('Could not update booking status.');
        }
        await loadBookings();
      }

      function bookingCard(booking) {
        const wrapper = document.createElement('article');
        wrapper.className = 'rounded-2xl border border-white/10 bg-white/[0.045] p-5 shadow-2xl shadow-black/25';
        wrapper.innerHTML = `
          <div class="flex flex-col gap-5 lg:flex-row lg:items-start lg:justify-between">
            <div>
              <div class="mb-3 inline-flex rounded-full border border-champagne/30 bg-champagne/10 px-3 py-1 text-xs font-semibold text-champagne">${booking.status}</div>
              <h2 class="text-xl font-semibold text-white">${booking.customerName}</h2>
              <p class="mt-1 text-sm text-stone-400">${booking.customerPhone}</p>
              <dl class="mt-5 grid gap-3 text-sm sm:grid-cols-2 lg:grid-cols-3">
                <div><dt class="text-stone-500">Pickup</dt><dd class="font-medium text-stone-100">${booking.pickup}</dd></div>
                <div><dt class="text-stone-500">Destination</dt><dd class="font-medium text-stone-100">${booking.destination}</dd></div>
                <div><dt class="text-stone-500">Date</dt><dd class="font-medium text-stone-100">${booking.date}</dd></div>
                <div><dt class="text-stone-500">Time</dt><dd class="font-medium text-stone-100">${booking.time}</dd></div>
                <div><dt class="text-stone-500">Passengers</dt><dd class="font-medium text-stone-100">${booking.passengers}</dd></div>
                <div><dt class="text-stone-500">Created</dt><dd class="font-medium text-stone-100">${new Date(booking.createdAt).toLocaleString()}</dd></div>
              </dl>
            </div>
            <div class="grid gap-3 sm:min-w-64">
              <a class="rounded-full bg-champagne px-4 py-3 text-center text-sm font-bold text-black transition hover:bg-[#ffe7a4]" href="${booking.document.url}" target="_blank">View / Download ID</a>
              <select class="rounded-xl border border-white/10 bg-black px-4 py-3 text-sm text-white" data-id="${booking.id}">
                ${statusOptions.map((option) => `<option value="${option}" ${option === booking.status ? 'selected' : ''}>${option}</option>`).join('')}
              </select>
            </div>
          </div>
        `;
        wrapper.querySelector('select').addEventListener('change', (event) => updateStatus(booking.id, event.target.value));
        return wrapper;
      }

      async function loadBookings() {
        statusEl.textContent = 'Loading bookings...';
        const response = await fetch('/api/bookings');
        const data = await response.json();
        bookingsEl.innerHTML = '';

        if (!data.bookings?.length) {
          statusEl.textContent = 'No bookings yet.';
          return;
        }

        statusEl.textContent = `${data.bookings.length} booking${data.bookings.length === 1 ? '' : 's'} found.`;
        data.bookings.forEach((booking) => bookingsEl.appendChild(bookingCard(booking)));
      }

      document.getElementById('refresh').addEventListener('click', loadBookings);
      loadBookings();
    </script>
  </body>
</html>
